name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r agent-backend/requirements.txt

      - name: Run tests
        working-directory: agent-backend
        run: python -m pytest -q --tb=short
        env:
          # No API keys — live-provider tests are skipped automatically via requires_backend marker
          GROQ_API_KEY: ""
          LLM_PROVIDER: "groq"
