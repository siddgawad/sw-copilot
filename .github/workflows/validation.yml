name: build123d validation

# Runs the headless validation harness on every push and PR. No SolidWorks
# needed — pure Python + OCCT via build123d. This is the gate that catches
# coordinate-system regressions and bad operation graphs before they ever
# hit the C# executor.

on:
  push:
    branches: [main, master]
    paths:
      - "agent-backend/**"
      - ".github/workflows/validation.yml"
  pull_request:
    paths:
      - "agent-backend/**"
      - ".github/workflows/validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent-backend/requirements.txt

      - name: Install system deps for OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install Python deps
        working-directory: agent-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify build123d import
        working-directory: agent-backend
        run: |
          python -c "import build123d; print('build123d', build123d.__version__)"

      - name: Run validation harness
        working-directory: agent-backend
        run: |
          pytest tests/validation/ -v --tb=short

      - name: Run full backend regression
        working-directory: agent-backend
        run: |
          pytest tests/ -q --ignore=tests/validation -k "not requires_backend"
